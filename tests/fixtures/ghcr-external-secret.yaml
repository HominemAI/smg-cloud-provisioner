apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: smg-cloud-provisioner-ghcr
  namespace: smg-cloud-provisioner
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: example-secret-store
    kind: ClusterSecretStore
  target:
    name: smg-cloud-provisioner-ghcr
    creationPolicy: Owner
    template:
      type: Opaque
  data:
  - secretKey: GHCR_PAT
    remoteRef:
      key: example-provisioner
      property: ghcr-pat
